<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style></head><body><script type="module">
// "Miau-Ringe": endless ring tunnel, 45 rings, every escape = one meow. Pace rises in 4 levels, last ring is a boss, then it rebuilds into a seamless loop.
import { W, H, FPS, g, bg, glowDot, hue, clamp01, lerp, ease, rng, finish } from './sat.js';
await document.fonts.load('800 64px Inter'); await document.fonts.load('80px "Noto Color Emoji"', '🐱😾🔥👑😺');
const NR = 45, Q = 1.12, R0 = 150, CX = 520, CY = 880, GAP = 0.9, BALL = 0.1, SEED = 11;
const plan = []; { let t = 0.25; for (let k = 0; k < NR; k++) { plan.push(t); t += k < 8 ? 1.6 : k < 20 ? 1.2 : k < 32 ? 0.9 : k < 43 ? 0.65 : 3.0; } }

const Rk = (k) => R0 * Q ** k;

const wrap = (a) => Math.atan2(Math.sin(a), Math.cos(a));
// ---------- physics (world space, 1200 Hz) ----------
const rand = rng(SEED), dt = 1 / 1200, END_PHYS = plan[NR - 1] + 2.5;
let x = 0, y = 0, cur = 0; { const a = rand() * 6.283, v = VS[1]; var vx = Math.cos(a) * v, vy = Math.sin(a) * v; }
const traj = [], events = [];
// time until the ball (radius b) moving from p with velocity u reaches circle radius Rc (from inside)
const hitTime = (px, py, ux, uy, Rc) => { const A = ux * ux + uy * uy, B = 2 * (px * ux + py * uy), C = px * px + py * py - Rc * Rc, D = B * B - 4 * A * C; return D < 0 ? null : (-B + Math.sqrt(D)) / (2 * A); };
const inGap = (k, px, py, ux, uy, t, tau, margin) => { const ha = Math.atan2(py + uy * tau, px + ux * tau); return Math.abs(wrap(ha - gapAng(k, t + tau))) < GAP / 2 - margin; };
function chooseDeflection(t) {
  const b = BALL * Rk(cur), wantEscape = cur < NR, pref = (rand() - 0.5) * 0.5;
  const cands = []; for (let j = -0.95; j <= 0.95; j += 0.01) cands.push(j); cands.sort((a, c) => Math.abs(a - pref) - Math.abs(c - pref));
  const rot = (j) => { const c = Math.cos(j), s = Math.sin(j); return [vx * c - vy * s, vx * s + vy * c]; };
  for (const j of cands) {
    const [ux, uy] = rot(j), tau = hitTime(x, y, ux, uy, Rk(cur) - b); if (tau === null) continue;
    const arrive = t + tau, escapeNow = arrive >= plan[cur] - 0.12, gapHit = inGap(cur, x, y, ux, uy, t, tau, 0.1);
    const ha = Math.atan2(y + uy * tau, x + ux * tau), off = Math.abs(wrap(ha - gapAng(cur, t + tau)));
    if (escapeNow) {
      if (!gapHit) continue;
      if (cur + 1 < NR) { const tau2 = hitTime(x, y, ux, uy, Rk(cur + 1) - BALL * Rk(cur + 1)); if (tau2 !== null && t + tau2 < plan[cur + 1] - 0.12 && inGap(cur + 1, x, y, ux, uy, t, tau2, -0.15)) continue; }
      return j;
    } else {
      if (off < GAP / 2 + 0.12) continue;
      if (cur === NR - 1 && off > GAP / 2 + 0.35 && rand() < 0.85) continue;   // boss ring: near misses
      return j;
    }
  }
  return pref;
}
let nb = 0;
{ const j = chooseDeflection(0), c = Math.cos(j), s = Math.sin(j); [vx, vy] = [vx * c - vy * s, vx * s + vy * c]; }
for (let step = 0; step * dt <= END_PHYS; step++) {
  const t = step * dt;
  if (step % 20 === 0) traj.push([x, y, cur]);
  x += vx * dt; y += vy * dt;
  if (cur >= NR) continue;
  const b = BALL * Rk(cur), d = Math.hypot(x, y), R = Rk(cur);
  if (d + b >= R) {
    const a = Math.atan2(y, x), off = Math.abs(wrap(a - gapAng(cur, t)));
    if (off < GAP / 2 - 0.05) {   // escape → ring breaks
      rings[cur].broke = t; events.push({ t, type: 'break', k: cur }); cur++;
      if (cur < NR) { const sp = VS[level(cur)] * Rk(cur) / R0, v = Math.hypot(vx, vy); vx = vx / v * sp; vy = vy / v * sp; }
    } else {
      const nx = x / d, ny = y / d, vn = vx * nx + vy * ny;
      if (vn > 0) { vx -= 2 * vn * nx; vy -= 2 * vn * ny; events.push({ t, type: 'bounce', k: cur, n: nb++ }); const j = chooseDeflection(t), c = Math.cos(j), s = Math.sin(j); [vx, vy] = [vx * c - vy * s, vx * s + vy * c]; }
      const k2 = (R - b) / d; x *= k2; y *= k2;
    }
  }
}
const breaks = rings.map(r => r.broke), tFree = breaks[NR - 1], T_REB = tFree + 2.3, DUR = T_REB + 2.4, FR = Math.round(DUR * FPS);
events.push({ t: T_REB, type: 'rebuild' });
// camera: current ring always ~R0 on screen
const camExp = (t) => { if (t >= T_REB) { const p = ease(clamp01((t - T_REB) / (DUR - T_REB - 0.15))); return lerp(NR, 0, p); } let e = 0; for (const tb of breaks) if (tb !== null && t > tb) e += ease(clamp01((t - tb) / 0.45)); return e; };
const shardR = rng(5); const shards = rings.map(() => [...Array(22)].map((_, i) => ({ a: i / 22 * 6.283 + shardR() * 0.2, sp: 0.35 + shardR() * 0.6, rot: (shardR() - 0.5) * 10 })));
const catR = rng(9); const cats = [...Array(40)].map(() => ({ a: catR() * 6.283, sp: 400 + catR() * 900, rot: (catR() - 0.5) * 6, s: 40 + catR() * 50 }));
function txt(s, x, y, size, col = '#fff', a = 1, font = 'Inter, "Noto Color Emoji"') { g.save(); g.globalAlpha = a; g.font = `900 ${size}px ${font}`; g.textAlign = 'center'; g.lineJoin = 'round'; g.lineWidth = size * 0.16; g.strokeStyle = 'rgba(0,0,0,0.85)'; g.strokeText(s, x, y); g.fillStyle = col; g.fillText(s, x, y); g.restore(); }
const pop = (u) => u <= 0 ? 0 : u >= 1 ? 1 : 1 + 2.7 * Math.pow(u - 1, 3) + 1.7 * Math.pow(u - 1, 2);
function draw(t) {
  bg();
  const e = camExp(t), z = 1 / Q ** e;   // world → screen scale relative to R0
  const broken = breaks.filter(b => b !== null && t >= b).length, reb = t >= T_REB;
  // tunnel streaks
  g.save(); g.strokeStyle = 'rgba(255,255,255,0.04)'; g.lineWidth = 2; for (let i = 0; i < 24; i++) { const a = i / 24 * 6.283 + t * 0.05; g.beginPath(); g.moveTo(CX + Math.cos(a) * 60, CY + Math.sin(a) * 60); g.lineTo(CX + Math.cos(a) * 1200, CY + Math.sin(a) * 1200); g.stroke(); } g.restore();
  // rings (outer first)
  for (let k = NR - 1; k >= 0; k--) {
    const rs = Rk(k) * z; if (rs > 470 || rs < 8) continue;
    const rg = rings[k], col = k === NR - 1 ? '#ffd23f' : hue(k * 13 + 190), alive = rg.broke === null || t < rg.broke || reb;
    if (alive) { const ga = gapAng(k, reb ? 0 : t), isCur = !reb && k === broken, boss = k === NR - 1;
      g.save(); g.strokeStyle = col; g.shadowColor = col; g.shadowBlur = isCur ? 30 : 12; g.lineWidth = boss ? 14 + 4 * Math.sin(t * 10) : isCur ? 9 : 6; g.globalAlpha = isCur || boss ? 1 : Math.max(0.25, 0.85 - (k - broken) * 0.06);
      g.beginPath(); g.arc(CX, CY, rs, ga + GAP / 2, ga - GAP / 2 + 6.283); g.stroke(); g.restore(); }
    else { const d = t - rg.broke; if (d < 1.2) { g.save(); g.strokeStyle = col; g.shadowColor = col; g.shadowBlur = 10; g.lineWidth = 5; g.globalAlpha = 1 - d / 1.2;
      for (const s of shards[k]) { const rr = (Rk(k) + s.sp * Rk(k) * d * 1.6) * z; g.save(); g.translate(CX + Math.cos(s.a) * rr, CY + Math.sin(s.a) * rr); g.rotate(s.a + s.rot * d); g.beginPath(); g.moveTo(-Rk(k) * z * 0.09, 0); g.lineTo(Rk(k) * z * 0.09, 0); g.stroke(); g.restore(); } g.restore();
      if (d < 0.3) { g.save(); g.globalAlpha = (1 - d / 0.3) * 0.6; g.strokeStyle = '#fff'; g.lineWidth = 4; g.beginPath(); g.arc(CX, CY, Rk(k) * z + d * 500, 0, 7); g.stroke(); g.restore(); } } }
  }
  // ball
  const fi = Math.min(traj.length - 1, Math.floor(t * 60)), lastK = broken - 1, bcol = lastK < 0 ? '#ffffff' : (lastK === NR - 1 ? '#ffd23f' : hue(lastK * 13 + 190));
  if (!reb) { for (let s = 7; s >= 1; s--) { const p = traj[Math.max(0, fi - s)]; glowDot(CX + p[0] * z, CY + p[1] * z, 16 * (1 - s / 9), bcol, 0.22 * (1 - s / 8)); } const p = traj[fi]; glowDot(CX + p[0] * z, CY + p[1] * z, 17, bcol); }
  else { const s = ease(clamp01((t - (DUR - 0.5)) / 0.4)); if (s > 0) glowDot(CX, CY, 17 * s, '#ffffff'); }
  // meow pops at each break
  for (const tb of breaks) { const d = t - tb; if (tb !== null && d >= 0 && d < 0.7) { const a = 1 - clamp01((d - 0.45) / 0.25); txt('MIAU!', CX + 150, CY - 170 - d * 120, 54 * pop(d / 0.25), '#ffd23f', a); } }
  // final burst
  if (t >= tFree && !reb) { const d = t - tFree; for (const c of cats) { const r = c.sp * d; txt('🐱', CX + Math.cos(c.a) * r, CY + Math.sin(c.a) * r + 600 * d * d, c.s, '#fff', 1 - clamp01((d - 1.6) / 0.6), '"Noto Color Emoji"'); }
    if (d < 0.5) { const gr = g.createRadialGradient(CX, CY, 0, CX, CY, 800); gr.addColorStop(0, `rgba(255,230,120,${(1 - d / 0.5) * 0.45})`); gr.addColorStop(1, 'rgba(255,230,120,0)'); g.fillStyle = gr; g.fillRect(0, 0, W, H); }

  for (const [k, lab] of [[8, '🔥 LEVEL 2'], [20, '🔥🔥 LEVEL 3'], [32, '🔥🔥🔥 LEVEL 4'], [44, '👑 LETZTER RING']]) { const tb = breaks[k - 1]; if (tb !== null) { const d = t - tb; if (d > 0 && d < (k === 44 ? 3.0 : 1.6)) txt(lab, 520, 330, (k === 44 ? 70 : 64) * pop(d / 0.3), k === 44 ? '#ffd23f' : '#ff7b54', 1 - clamp01((d - (k === 44 ? 2.7 : 1.3)) / 0.3)); } }

finish((t) => draw(t), FR, events, { breaks, tFree, dur: DUR, plan });
</script></body></html>
